<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOGUN The Mongol Invasion</title>

    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="start-screen">
      <h1>SHOGUN: The Mongol Invasion</h1>
      <div class="subtitle">
        <p>
          "An unstoppable army has crossed the sea. The Mongols have invaded
          Japan, destroying villages and threatening the lives of thousands.
          Become the last hope of your people. Run, jump and survive. Japan is counting on you, your journey starts now !
        </p>
      </div>

      <button class="start-btn">Start Game</button>
      <button class="howtoplay-btn">How to play</button>
    </div>

    <div class="game-container">
      <div class="game-screen screen">
        <div class="city-slider">
          <img src="./assets/backgroundimage4.png"/>
          <img src="./assets/backgroundimage4.png"/>
        </div>
        <div class="life">
          <img class="heart" src="./assets/heart-full.png"/>
          <img class="heart" src="./assets/heart-full.png"/>
          <img class="heart" src="./assets/heart-full.png"/>
        </div>
      </div>
      <div class="end-screen screen">
        <h1>GAME OVER</h1>
        <h3>Try Again?</h3>
        <div class="gameover-options">
          <button class="yes-btn">YES</button>
          <button onclick="window.location.href = 'index.html'" class="no-btn">
            NO
          </button>
        </div>
      </div>
    </div>

    <script src="./js/player.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/enemy.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
